# Default paths for S2GOS Generator
#
# Data source paths - used for DEM, land cover, and material configuration
dem_index_path: "dem_index.feather"
dem_root_dir: "/media/DATA/DEM"
landcover_index_path: "landcover_index.feather"
landcover_root_dir: "/media/DATA/Landcover/"
material_config_path: "materials.json"

# Asset search paths - locations to search for vegetation XML files, user PLY meshes, and XML scene imports
asset_search_paths:
  - "{PACKAGE_DATA}"  # Built-in vegetation assets (tls_tree_*.xml, etc.)
  # Add custom asset directories below:
  # - "/path/to/your/custom/assets"
  # - "/another/asset/location"